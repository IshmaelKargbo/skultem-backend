security:
  jwt:
    access-expiration: ${SKULTEM_ACCESS_EXP_MS:900000}
    refresh-expiration: ${SKULTEM_REFRESH_EXP_MS:604800000}
    secret: ${SKULTEM_SECRET_KEY:q6sZ2v4E0j1W8v7o9Jj8lZtFJk9s6Fh1z4Q9a5yKpU8=}
server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 50MB
spring:
  application:
    name: skultem
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
    password: ${DB_PASS:moriba@2024}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skultem}
    username: ${DB_USER:moriba}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: baseline
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true
