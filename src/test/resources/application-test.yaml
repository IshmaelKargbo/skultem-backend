debug: false
logging:
  level:
    root: INFO
    com.moriba.skultem: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO
spring:
  datasource:
    url: "jdbc:h2:mem:skultem;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,VALUE,WORKING,DAY;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# No real DNS in tests - EmailValidationServiceTest covers the domain check with a stand-in resolver.
email-validation:
  domain-check: false
# Tests never send mail - a dummy key so the app starts without EMAIL_API_KEY.
mailtrap:
  token: test-token
